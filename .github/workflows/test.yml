name: macOS regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Prepare scratch
        run: |
          mkdir -p "$RUNNER_TEMP/fluid-push-to-talk"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP/fluid-push-to-talk" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare scratch and report Xcode
        run: |
          mkdir -p "$TMPDIR"
          xcodebuild -version
          swift --version
      - name: Build, XCTest and offline regression checks
        run: python3 tests/run_all.py --skip-llm
